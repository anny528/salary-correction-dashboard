*{box-sizing:border-box;margin:0;padding:0}

html,body{background:var(--bg);color:var(--ink);font-family:"Inter","PingFang SC","Microsoft YaHei",system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:1180px;margin:0 auto;padding:28px 24px 64px}
/* header */
.hd{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:24px}
.hd h1{font-size:30px;font-weight:800;letter-spacing:-.02em;line-height:1.15}
.hd-meta{margin-top:8px;font-size:13px;color:var(--ink3);font-weight:500}
.hd .dl-btn{flex:0 0 auto;border:1px solid var(--line);background:#fff;color:var(--ink2);padding:8px 14px;border-radius:10px;font-size:13px;font-weight:600;cursor:pointer;transition:.15s}
.hd .dl-btn:hover{border-color:#cbd5e1;color:var(--ink)}
/* cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px;box-shadow:0 1px 2px rgba(16,24,40,.03)}
.bento{display:grid;gap:18px;margin-bottom:18px}
.bento-4{grid-template-columns:repeat(4,1fr)}
.bento-2{grid-template-columns:1fr 1fr}
/* KPI */
.kpi{position:relative;overflow:hidden}
.kpi::before{content:"";position:absolute;top:0;left:0;right:0;height:4px}
.kpi.k1::before{background:linear-gradient(90deg,#00d4ff,transparent)}
.kpi.k2::before{background:linear-gradient(90deg,#a855f7,transparent)}
.kpi.k3::before{background:linear-gradient(90deg,#ec4899,transparent)}
.kpi.k4::before{background:linear-gradient(90deg,#10b981,transparent)}
.kpi-l{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--ink3);margin-bottom:8px}
.kpi-v{font-size:40px;font-weight:900;letter-spacing:-.03em;line-height:1;margin-bottom:8px;color:var(--ink)}
.kpi-u{font-size:18px;font-weight:500;opacity:.4;margin-left:3px}
.kpi-s{font-size:13px;color:var(--ink2);line-height:1.5;margin-top:4px}
.kpi-g{position:absolute;top:-30px;right:-20px;width:120px;height:120px;border-radius:50%;filter:blur(45px);opacity:.08}
.kpi.k1 .kpi-g{background:#00d4ff}.kpi.k2 .kpi-g{background:#a855f7}.kpi.k3 .kpi-g{background:#ec4899}.kpi.k4 .kpi-g{background:#10b981}
/* chart card header */
.cc-hd{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:16px}
.cc-t{font-size:16px;font-weight:700}
.cc-s{font-size:12px;color:var(--ink3);margin-top:3px}
.pill{font-size:11px;font-weight:700;padding:3px 10px;border-radius:999px;letter-spacing:.02em}
.pc{background:rgba(6,182,212,.12);color:#0891b2}
.pp{background:rgba(168,85,247,.12);color:#7c3aed}
/* donut */
.donut-flex{display:flex;align-items:center;gap:26px}
.donut-box{flex:0 0 auto;position:relative}
.donut-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.donut-center .v{font-size:22px;font-weight:900;letter-spacing:-.02em}
.donut-center .l{font-size:11px;color:var(--ink3);margin-top:2px}
.legend{flex:1;display:flex;flex-direction:column;gap:12px}
.lg-item{display:flex;align-items:center;gap:10px}
.lg-dot{width:10px;height:10px;border-radius:3px;flex:0 0 auto}
.lg-t{font-size:14px;font-weight:700}
.lg-m{font-size:12px;color:var(--ink2);margin-top:1px}
.lg-p{margin-left:auto;font-size:14px;font-weight:800}
/* table */
.tbl-wrap{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse;font-size:13px}
table.tbl thead th{text-align:left;padding:10px 12px;font-size:11px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:.05em;border-bottom:1px solid var(--line);white-space:nowrap}
table.tbl tbody td{padding:12px;border-bottom:1px solid #f1f3f5;color:var(--ink);white-space:nowrap}
table.tbl tbody tr:last-child td{border-bottom:none}
.td-dept{font-weight:600}
.td-hrs{font-weight:800}
.td-total{font-weight:800;color:var(--ink)}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 9px;border-radius:6px}
.tag-考勤原因{background:rgba(59,130,246,.12);color:#2563eb}
.tag-提前用工{background:rgba(168,85,247,.12);color:#7c3aed}
.tag-系统问题{background:rgba(239,68,68,.12);color:#dc2626}
.tag-核算问题{background:rgba(245,158,11,.14);color:#b45309}
.tag-排班问题{background:rgba(16,185,129,.14);color:#059669}
.td-cnt{color:var(--ink2)}
.trend-up{color:#dc2626;font-weight:700}
.trend-down{color:#059669;font-weight:700}
.ft{text-align:center;font-size:12px;color:var(--ink3);margin-top:12px}
@media(max-width:1080px){.bento-4{grid-template-columns:repeat(2,1fr)}.bento-2{grid-template-columns:1fr}.hd h1{font-size:26px}}
@media(max-width:640px){.bento-4{grid-template-columns:1fr}.kpi-v{font-size:34px}.hd h1{font-size:24px}.donut-flex{flex-direction:column}}
</style>

var TC={"考勤原因": "#3b82f6", "提前用工": "#a855f7", "系统问题": "#ef4444", "核算问题": "#f59e0b", "排班问题": "#10b981"};
var typeOrder=["考勤原因", "提前用工", "系统问题", "核算问题", "排班问题"];

function money(v){
  var s=Math.round(v*100)/100;
  var neg=s<0; s=Math.abs(s);
  var parts=s.toFixed(2).split('.');
  parts[0]=parts[0].replace(/\B(?=(\d{3})+(?!\d))/g,',');
  return (neg?'-':'')+DATA.currency+parts.join('.');
}
function moneyShort(v){
  if(Math.abs(v)>=1000)return DATA.currency+(v/1000).toFixed(0)+'k';
  return DATA.currency+Math.round(v);
}
function fmtN(v){return Math.round(v*100)/100;}
function tclass(t){return 'tag-'+t;}

var totalAmt=DATA.types.reduce(function(s,t){return s+t.amount},0);
var totalCnt=DATA.types.reduce(function(s,t){return s+t.count},0);

// KPI

'<div class="card kpi k1"><div class="kpi-g"></div><div class="kpi-l">累计勘误金额</div><div class="kpi-v" style="font-size:34px">'+money(totalAmt)+'</div><div class="kpi-s">近3个月合计 · 6/7/8月</div></div>'+
'<div class="card kpi k2"><div class="kpi-g"></div><div class="kpi-l">勘误总笔数</div><div class="kpi-v">'+totalCnt+'<span class="kpi-u">笔</span></div><div class="kpi-s">含所有异常类型</div></div>'+
'<div class="card kpi k3"><div class="kpi-g"></div><div class="kpi-l">涉及区域</div><div class="kpi-v">'+DATA.regions.length+'<span class="kpi-u">个</span></div><div class="kpi-s">'+DATA.regions.slice(0,4).map(function(r){return r.name.replace(/ (中南|东北|美西|佛州|德州)大区|项目部|部/,'')}).join(' · ')+' …</div></div>'+
'<div class="card kpi k4"><div class="kpi-g"></div><div class="kpi-l">异常类型</div><div class="kpi-v">'+typeOrder.length+'<span class="kpi-u">种</span></div><div class="kpi-s">'+typeOrder.join(' · ')+'</div></div>';

// Chart 1: 近3个月趋势（单柱柱形图 + 环比）
(function(){
  var nR=DATA.monthly.length;
  var W=860,H=440,T=48,B=72,L=84,R=30;
  var cw=W-L-R,ch=H-T-B,gap=cw/nR,bw=Math.min(gap*0.42,140);
  var maxV=Math.max.apply(null,DATA.monthly.map(function(m){return m.total}));
  maxV=Math.ceil(maxV/10000)*10000+10000;
  var h='<svg width="100%" viewBox="0 0 '+W+' '+H+'" style="display:block">';
  for(var i=0;i<=4;i++){var gy=T+ch*(1-i/4);h+='<line x1="'+L+'" y1="'+gy+'" x2="'+(W-R)+'" y2="'+gy+'" stroke="#e5e7eb"/>';h+='<text x="'+(L-8)+'" y="'+(gy+4)+'" text-anchor="end" font-size="11" fill="#9ca3af">'+moneyShort(maxV*i/4)+'</text>';}
  DATA.monthly.forEach(function(m,ri){
    var cx=L+ri*gap+gap/2;
    var barH=m.total/maxV*ch;
    var by=T+ch-barH;
    // 单柱（渐变蓝紫）
    h+='<defs><linearGradient id="g'+ri+'" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a855f7"/><stop offset="1" stop-color="#7c3aed"/></linearGradient></defs>';
    h+='<rect x="'+(cx-bw/2)+'" y="'+by+'" width="'+bw+'" height="'+barH+'" rx="8" fill="url(#g'+ri+')"><title>'+m.month+': '+money(m.total)+' ('+m.count+'笔)</title></rect>';
    // 柱顶总额 + 笔数
    h+='<text x="'+cx+'" y="'+(by-8)+'" text-anchor="middle" font-size="15" fill="#111827" font-weight="800">'+money(m.total)+'</text>';
    h+='<text x="'+cx+'" y="'+(by-24)+'" text-anchor="middle" font-size="11" fill="#6b7280">'+m.count+' 笔</text>';
    // 环比（vs 上月）
    if(ri>0){
      var prev=DATA.monthly[ri-1].total;
      var r=(m.total-prev)/prev*100;
      var up=r>0, sign=up?'↑':'↓';
      h+='<text x="'+cx+'" y="'+(by-40)+'" text-anchor="middle" font-size="12" fill="'+(up?'#dc2626':'#059669')+'" font-weight="700">环比 '+sign+Math.abs(r).toFixed(1)+'%</text>';
    }
    h+='<text x="'+cx+'" y="'+(H-28)+'" text-anchor="middle" font-size="14" fill="#6b7280" font-weight="700">'+m.month+'</text>';
  });
  h+='</svg>';

// Chart 2: 异常类型分布（环形）
(function(){
  var R=70,C=2*Math.PI*R,SW=26;
  var segs=DATA.types.map(function(t){
    return {type:t.type,count:t.count,amount:t.amount,pct:t.amount/totalAmt*100};
  });
  var acc=0;segs.forEach(function(s){s.start=acc;acc+=s.amount/totalAmt});
  var h='<div class="donut-flex"><div class="donut-box" style="width:180px;height:180px">';
  h+='<svg width="180" height="180" viewBox="0 0 180 180">';
  h+='<circle cx="90" cy="90" r="'+R+'" fill="none" stroke="#eef0f3" stroke-width="'+SW+'"/>';
  segs.forEach(function(s){
    var len=s.amount/totalAmt*C;
    h+='<circle cx="90" cy="90" r="'+R+'" fill="none" stroke="'+TC[s.type]+'" stroke-width="'+SW+'" stroke-dasharray="'+len.toFixed(2)+' '+(C-len).toFixed(2)+'" stroke-dashoffset="'+(-s.start*C).toFixed(2)+'" transform="rotate(-90 90 90)"/>';
  });
  h+='</svg>';
  h+='<div class="donut-center"><div class="v">'+money(totalAmt)+'</div><div class="l">'+totalCnt+' 笔</div></div>';
  h+='</div><div class="legend">';
  segs.forEach(function(s){
    h+='<div class="lg-item"><span class="lg-dot" style="background:'+TC[s.type]+'"></span><div><div class="lg-t">'+s.type+'</div><div class="lg-m">'+s.count+' 笔 · '+money(s.amount)+'</div></div><div class="lg-p" style="color:'+TC[s.type]+'">'+s.pct.toFixed(1)+'%</div></div>';
  });
  h+='</div></div>';
  document.getElementById('chartType').innerHTML=h;
})();

// Chart 3: 各区域勘误金额（四种类型横向堆叠）
(function(){
  var regs=DATA.regions.slice().sort(function(a,b){return b.amount-a.amount});
  var nR=regs.length;
  var W=560,H=nR*42+46,L=128,R=76;
  var cw=W-L-R;
  var maxV=Math.max.apply(null,regs.map(function(r){return r.amount}));
  maxV=Math.ceil(maxV/10000)*10000;
  var h='<svg width="100%" viewBox="0 0 '+W+' '+H+'" style="display:block">';
  // legend
  var lx=L;
  typeOrder.forEach(function(t){h+='<rect x="'+lx+'" y="10" width="12" height="12" rx="3" fill="'+TC[t]+'"/>';h+='<text x="'+(lx+16)+'" y="20" font-size="11" fill="#6b7280">'+t+'</text>';lx+=16+t.length*14+12});
  regs.forEach(function(r,i){
    var y=40+i*42;
    h+='<text x="'+(L-8)+'" y="'+(y+20)+'" text-anchor="end" font-size="12" fill="#111827" font-weight="600">'+r.name+'</text>';
    // 按类型顺序横向堆叠
    var sx=L;
    typeOrder.forEach(function(t){
      var tv=0;
      r.types.forEach(function(rt){if(rt.type===t)tv=rt.amount});
      if(tv<=0)return;
      var sw=tv/maxV*cw;
      var isFirst=(sx===L), isLast;
      h+='<rect x="'+sx+'" y="'+(y+6)+'" width="'+sw+'" height="22" fill="'+TC[t]+'"><title>'+r.name+' / '+t+': '+money(tv)+'</title></rect>';
      sx+=sw;
    });
    h+='<text x="'+(sx+8)+'" y="'+(y+22)+'" font-size="12" fill="#111827" font-weight="700">'+money(r.amount)+'</text>';
  });
  h+='</svg>';
  document.getElementById('chartRegion').innerHTML=h;
})();

function downloadImg(){
  if(typeof html2canvas==='undefined'){alert('长图组件未加载（需联网），请直接用浏览器截图');return;}
  html2canvas(document.body,{scale:2,backgroundColor:'#f5f6f8'}).then(function(canvas){
    var a=document.createElement('a');
    a.download='薪酬勘误看板.png';
    a.href=canvas.toDataURL('image/png');
    a.click();
  });
}
